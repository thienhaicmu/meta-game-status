# Meta Game — keeps portals.json pointing at each game portal's LIVE page (the domains move).
# Deployed by tools/deploy-status-repo.mjs (source: the private meta-game repo, tools/status-repo/).
name: portals

on:
  schedule:
    - cron: '7,22,37,52 * * * *' # every 15 minutes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: portals
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: resolve
        run: node .github/scripts/resolve-portals.cjs portals.json
      - name: Commit
        if: steps.resolve.outputs.message != ''
        run: |
          git config user.name "meta-game-portals"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portals.json
          git commit -m "${{ steps.resolve.outputs.message }}"
          git pull --rebase --autostash
          git push
